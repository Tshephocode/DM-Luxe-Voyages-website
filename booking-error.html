<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Error - DM Luxe Voyages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f8f9fa;
        }

        .error-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .error-icon {
            font-size: 80px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>Booking Submission Failed</h1>
        <p>We're sorry, but there was an error processing your booking request. Please try again or contact us directly.</p>
        <p>Phone: +27 72 369 9937<br>Email: bookings@dmluxe.co.za</p>
        <div>
            <a href="booking.html" class="btn">Try Again</a>
            <a href="index.html" class="btn">Return to Home</a>
        </div>
    </div>
</body>
</html>
